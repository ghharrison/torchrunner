experiments_root: experiments
experiment_name: default
batch_size: 64
epochs: 10
device: cpu
dataset:
  name: FashionMNIST
  transforms:
    train:
      - name: ToImage
        params: {}
      - name: ToDtype
        params:
          dtype: float32
          scale: true
    eval:
      - name: ToImage
        params: {}
      - name: ToDtype
        params:
          dtype: float32
          scale: true
model:
  type: mlp
  params:
    in_channels: 1
    image_dim: 28
    linear_layer_size: 512
    output_classes: 10
loss_fn:
  type: crossentropy
  params: {}
optimizer:
  type: sgd
  params:
    lr: 0.001