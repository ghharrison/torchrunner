experiments_root: experiments
experiment_name: cifar10
batch_size: 64
epochs: 10
device: cuda
dataset:
  name: CIFAR10
  transforms:
    train:
      - name: RandomHorizontalFlip
        params: {}
      - name: RandomVerticalFlip
        params: {}
      - name: RandomCrop
        params:
          size: 32
          padding: 4
      - name: ToImage
        params: {}
      - name: ToDtype
        params:
          dtype: float32
          scale: true
      - name: Normalize
        params:
          mean:
            - 0.4914
            - 0.4822
            - 0.4465
          std:
            - 0.2023
            - 0.1994
            - 0.2010
    eval:
      - name: ToImage
        params: {}
      - name: ToDtype
        params:
          dtype: float32
          scale: true
      - name: Normalize
        params:
          mean:
            - 0.4914
            - 0.4822
            - 0.4465
          std:
            - 0.2023
            - 0.1994
            - 0.2010
model:
  type: cnn
  params:
    in_channels: 3
    image_dim: 32
    conv_layer_size: 16
    kernel_size: 3
    stride: 2
    padding: 1
    output_classes: 10
loss_fn:
  type: crossentropy
  params: {}
optimizer:
  type: sgd
  params:
    lr: 0.001