experiments_root: experiments
experiment_name: cifar10
batch_size: 64
epochs: 10
device: cuda
dataset:
  name: CIFAR10
  transforms:
    train:
      - name: ToImage
        params: {}
      - name: ToDtype
        params:
          dtype: float32
          scale: true
      - name: Normalize
        params:
          mean:
            - 0.4914
            - 0.4822
            - 0.4465
          std:
            - 0.2023
            - 0.1994
            - 0.2010
    eval:
      - name: ToImage
        params: {}
      - name: ToDtype
        params:
          dtype: float32
          scale: true
      - name: Normalize
        params:
          mean:
            - 0.4914
            - 0.4822
            - 0.4465
          std:
            - 0.2023
            - 0.1994
            - 0.2010
model:
  - type: cnn
    params:
      in_channels: 3
      pool_factor: 2  # Use MaxPool2d(2,2) to reduce by factor of 2
      out_channels: [16, 32, 64]
      input_image_dim: 32
      kernel_sizes: [5, 5, 5]
      padding: 'same'
  - type: mlp
    params:
      in_channels: 64
      input_image_dim: 4
      hidden_layer_sizes: [512, 256, 128]
      output_classes: 10

loss_fn:
  type: crossentropy
  params: {}
optimizer:
  type: sgd
  params:
    lr: 0.001
    momentum: 0.9